## Sonar properties for Angular Simple App (angular/simple-app)
sonar.projectKey=Aizhy_sonar-samples
sonar.projectName=Angular Simple App Sample
sonar.projectVersion=1.0

# Project language and paths
sonar.sourceEncoding=UTF-8
sonar.sources=src

# Exclude node_modules, build output and tests
sonar.exclusions=**/node_modules/**,dist/**,**/*.spec.ts

# Coverage: path produced by Karma coverage reporter
sonar.typescript.lcov.reportPaths=coverage/simple-app/lcov.info
sonar.javascript.lcov.reportPaths=coverage/simple-app/lcov.info

# SonarCloud settings (can be overridden in CI via -D properties)
sonar.host.url=https://sonarcloud.io
sonar.organization=Aizhy
