name: SonarCloud Scan

on:
    push:
        branches: [ "main" ]
    pull_request:

jobs:
    sonarcloud:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Run tests with coverage
              run: npm test -- --coverage

            - name: SonarCloud Scan
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: |
                npm install -g sonar-scanner
                sonar-scanner
                    -Dsonar.projectKey=<organisation>_<repo> \
                    -Dsonar.organization=<organisation>