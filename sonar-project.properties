## Sonar properties for Angular Simple App (angular/simple-app)
# SonarCloud / SonarQube connection
sonar.host.url=https://sonarcloud.io
sonar.organization=aizhy

# Project identity
sonar.projectKey=Aizhy_sonar-samples
sonar.projectName=sonar-samples
sonar.projectVersion=1.0.0

# Encoding and sources
sonar.sourceEncoding=UTF-8
# Use '.' to analyze the current folder (angular/simple-app) or set to 'src' if preferred
sonar.sources=.

# Exclusions: ignore node_modules, build outputs and test files
sonar.exclusions=**/node_modules/**,dist/**,**/*.spec.ts

# Coverage report paths (generated by Karma)
sonar.typescript.lcov.reportPaths=coverage/simple-app/lcov.info
sonar.javascript.lcov.reportPaths=coverage/simple-app/lcov.info

# You can override any of these with -D properties in CI
