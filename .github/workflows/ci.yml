name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Each sample job builds, scans and asserts its sample against a SonarQube of its own.
# On GitHub, the job starts the SonarQube of compose.yaml, as a local run does, and its token replaces the empty secret.
# A runner that brings a SonarQube, such as IstarCI, sets vars.SONAR_HOST_URL and secrets.SONAR_TOKEN, and the job uses it instead.
# Its quality profile may not be the one the bootstrap gives the samples, so the assert only checks there that each analysis landed,
# unless the runner sets SONAR_ASSERT_ISSUES to true, as .istarci.yml does with the profile it names.
# The token is read from the environment, never from an expression mixing steps and secrets, which IstarCI evaluates with the steps alone.

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@5f20a3230f56e8e39704e976a1d2bdd9e1427c36

  repository-check:
    name: Repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Task
        uses: devpro/github-workflow-parts/actions/task/setup@5f20a3230f56e8e39704e976a1d2bdd9e1427c36
      - name: Check the Taskfile parses
        run: task --list-all
      - name: Check compose.yaml
        run: docker compose config --quiet
      - name: Check the SonarQube image tag exists
        run: |
          image=$(docker compose config --images | grep sonarqube)
          echo "Resolving ${image}"
          docker manifest inspect "${image}" > /dev/null

  nodejs:
    name: Node.js
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'http://localhost:9000' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ASSERT_ISSUES: ${{ vars.SONAR_HOST_URL == '' }}
    timeout-minutes: 20
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Task
        uses: devpro/github-workflow-parts/actions/task/setup@5f20a3230f56e8e39704e976a1d2bdd9e1427c36
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: Start SonarQube
        if: vars.SONAR_HOST_URL == ''
        run: |
          token=$(task --silent bootstrap)
          echo "::add-mask::${token}"
          echo "SONAR_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: Build and test
        run: task build:nodejs
      - name: Analyze with Sonar
        uses: devpro/github-workflow-parts/actions/sonar/scan@5f20a3230f56e8e39704e976a1d2bdd9e1427c36
        with:
          host-url: ${{ env.SONAR_HOST_URL }}
          token: ${{ env.SONAR_TOKEN }}
          working-directory: samples/nodejs
      - name: Assert the analysis
        run: task assert:nodejs
      - name: Show SonarQube logs
        if: failure() && vars.SONAR_HOST_URL == ''
        run: docker compose logs --tail 200 sonarqube

  python:
    name: Python
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'http://localhost:9000' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ASSERT_ISSUES: ${{ vars.SONAR_HOST_URL == '' }}
    timeout-minutes: 20
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Task
        uses: devpro/github-workflow-parts/actions/task/setup@5f20a3230f56e8e39704e976a1d2bdd9e1427c36
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Start SonarQube
        if: vars.SONAR_HOST_URL == ''
        run: |
          token=$(task --silent bootstrap)
          echo "::add-mask::${token}"
          echo "SONAR_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: Build and test
        run: task build:python
      - name: Analyze with Sonar
        uses: devpro/github-workflow-parts/actions/sonar/scan@5f20a3230f56e8e39704e976a1d2bdd9e1427c36
        with:
          host-url: ${{ env.SONAR_HOST_URL }}
          token: ${{ env.SONAR_TOKEN }}
          working-directory: samples/python
      - name: Assert the analysis
        run: task assert:python
      - name: Show SonarQube logs
        if: failure() && vars.SONAR_HOST_URL == ''
        run: docker compose logs --tail 200 sonarqube

  go:
    name: Go
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'http://localhost:9000' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ASSERT_ISSUES: ${{ vars.SONAR_HOST_URL == '' }}
    timeout-minutes: 20
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Task
        uses: devpro/github-workflow-parts/actions/task/setup@5f20a3230f56e8e39704e976a1d2bdd9e1427c36
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.26"
          # no third-party dependencies, so no go.sum to key a cache on
          cache: false
      - name: Start SonarQube
        if: vars.SONAR_HOST_URL == ''
        run: |
          token=$(task --silent bootstrap)
          echo "::add-mask::${token}"
          echo "SONAR_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: Build and test
        run: task build:go
      - name: Analyze with Sonar
        uses: devpro/github-workflow-parts/actions/sonar/scan@5f20a3230f56e8e39704e976a1d2bdd9e1427c36
        with:
          host-url: ${{ env.SONAR_HOST_URL }}
          token: ${{ env.SONAR_TOKEN }}
          working-directory: samples/go
      - name: Assert the analysis
        run: task assert:go
      - name: Show SonarQube logs
        if: failure() && vars.SONAR_HOST_URL == ''
        run: docker compose logs --tail 200 sonarqube

  java:
    name: Java
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'http://localhost:9000' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ASSERT_ISSUES: ${{ vars.SONAR_HOST_URL == '' }}
    timeout-minutes: 20
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Task
        uses: devpro/github-workflow-parts/actions/task/setup@5f20a3230f56e8e39704e976a1d2bdd9e1427c36
      - name: Install Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start SonarQube
        if: vars.SONAR_HOST_URL == ''
        run: |
          token=$(task --silent bootstrap)
          echo "::add-mask::${token}"
          echo "SONAR_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: Build and test
        run: task build:java
      # The Maven plugin is the scanner of a Maven project, which reads the compiled classes and the JaCoCo report
      - name: Analyze with Sonar
        run: task scan:java
      - name: Assert the analysis
        run: task assert:java
      - name: Show SonarQube logs
        if: failure() && vars.SONAR_HOST_URL == ''
        run: docker compose logs --tail 200 sonarqube

  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'http://localhost:9000' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ASSERT_ISSUES: ${{ vars.SONAR_HOST_URL == '' }}
    timeout-minutes: 20
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Task
        uses: devpro/github-workflow-parts/actions/task/setup@5f20a3230f56e8e39704e976a1d2bdd9e1427c36
      - name: Install .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Start SonarQube
        if: vars.SONAR_HOST_URL == ''
        run: |
          token=$(task --silent bootstrap)
          echo "::add-mask::${token}"
          echo "SONAR_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: Build and test
        run: task build:dotnet
      # The scanner for .NET wraps the build, so the analysis builds and tests the sample again
      - name: Analyze with Sonar
        run: task scan:dotnet
      - name: Assert the analysis
        run: task assert:dotnet
      - name: Show SonarQube logs
        if: failure() && vars.SONAR_HOST_URL == ''
        run: docker compose logs --tail 200 sonarqube

  angular:
    name: Angular
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'http://localhost:9000' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ASSERT_ISSUES: ${{ vars.SONAR_HOST_URL == '' }}
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Task
        uses: devpro/github-workflow-parts/actions/task/setup@5f20a3230f56e8e39704e976a1d2bdd9e1427c36
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      # The latest CLI on purpose, since the sample is the app it generates today
      # Installed where the job owns the directory, so neither root nor sudo is needed
      - name: Install the Angular CLI
        run: |
          npm install --global --prefix "${RUNNER_TEMP}/npm" @angular/cli
          echo "${RUNNER_TEMP}/npm/bin" >> "$GITHUB_PATH"
      - name: Start SonarQube
        if: vars.SONAR_HOST_URL == ''
        run: |
          token=$(task --silent bootstrap)
          echo "::add-mask::${token}"
          echo "SONAR_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: Build and test
        run: task build:angular
      - name: Analyze with Sonar
        uses: devpro/github-workflow-parts/actions/sonar/scan@5f20a3230f56e8e39704e976a1d2bdd9e1427c36
        with:
          host-url: ${{ env.SONAR_HOST_URL }}
          token: ${{ env.SONAR_TOKEN }}
          working-directory: samples/angular/my-angular-app
      - name: Assert the analysis
        run: task assert:angular
      - name: Show SonarQube logs
        if: failure() && vars.SONAR_HOST_URL == ''
        run: docker compose logs --tail 200 sonarqube
