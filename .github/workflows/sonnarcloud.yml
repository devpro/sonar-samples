name: SonarCloud Analysis

on: [push, pull_request]

jobs:
  sonarcloud:
    name: Build and Analyze with SonarCloud
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular/simple-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests and generate coverage
        run: npm test -- --watch=false --code-coverage --browsers=ChromeHeadless || true

      - name: Run SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONNAR_TOKEN }}
        run: |
          npm install -g sonar-scanner
          sonar-scanner \
            -Dsonar.projectKey=Aizhy_sonar-samples \
            -Dsonar.organization=aizhy \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONNAR_TOKEN }}
