sonar.projectKey=sonar-samples-angular
sonar.projectName=sonar-samples / angular
sonar.sources=src
sonar.exclusions=node_modules/**,dist/**,**/*.spec.ts,coverage/**
# Angular >= 20 writes coverage to coverage/<project-name>/lcov.info, hence the glob.
# Use sonar.javascript.lcov.reportPaths for TypeScript too: the sonar.typescript.*
# variant is deprecated and silently ignored by current SonarQube.
sonar.javascript.lcov.reportPaths=coverage/*/lcov.info
sonar.host.url=http://localhost:9000
